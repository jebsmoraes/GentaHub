services:
  - type: web
    name: gentahub-backend
    runtime: python
    dir: gentahub-backend
    buildCommand: cd gentahub-backend && pip install -r requirements.txt
    startCommand: cd gentahub-backend && python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: OPENAI_API_KEY
        value: "YOUR_OPENAI_API_KEY"
        scope: all
      - key: STRIPE_SECRET_KEY
        value: "YOUR_STRIPE_SECRET_KEY"
        scope: all
      - key: STRIPE_PUBLISHABLE_KEY
        value: "YOUR_STRIPE_PUBLISHABLE_KEY"
        scope: all
      - key: DATABASE_URL
        value: "postgresql://user:password@host:port/database"
        scope: all
      - key: REDIS_URL
        value: "redis://localhost:6379"
        scope: all
      - key: JWT_SECRET_KEY
        value: "YOUR_JWT_SECRET_KEY"
        scope: all
    healthCheckPath: /api/system/info

  - type: web
    name: gentahub-frontend
    runtime: node
    dir: gentahub
    buildCommand: cd gentahub && npm install && npm run build
    startCommand: cd gentahub && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://gentahub-backend.onrender.com


